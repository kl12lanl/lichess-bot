name: LichessBot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Run Bot Engine
      run: |
        echo "=== СОЗДАЕМ ПАПКУ ДЛЯ ДВИЖКА ==="
        mkdir -p engines
        
        echo "=== СКАЧИВАЕМ НАСТОЯЩИЙ STOCKFISH ДЛЯ LINUX ==="
        # Скачиваем официальный стабильный Stockfish 16.1
        curl -L -o stockfish.tar.xz https://github.com
        
        echo "=== РАСПАКОВЫВАЕМ И ПЕРЕИМЕНОВЫВАЕМ ==="
        tar -xf stockfish.tar.xz
        # Переносим исполняемый файл движка строго в папку engines под именем stockfish
        cp stockfish/stockfish-ubuntu-x86-64 engines/stockfish
        
        echo "=== НАСТРАИВАЕМ ПРАВА НА ЗАПУСК ==="
        chmod +x engines/stockfish
        
        echo "=== СТАРТ ШАХМАТНОГО БОТА ==="
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        python lichess-bot.py
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
