name: LichessBot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Run Bot Engine
      run: |
        echo "=== УСТАНАВЛИВАЕМ СТОКФИШ ИЗ РЕПОЗИТОРИЯ LINUX ==="
        sudo apt update && sudo apt install -y stockfish
        
        echo "=== СОЗДАЕМ ПАПКУ И КОПИРУЕМ ТУДА ДВИЖОК ==="
        mkdir -p engines
        cp /usr/games/stockfish ./engines/stockfish
        chmod +x ./engines/stockfish
        
        echo "=== СТАРТ ШАХМАТНОГО БОТА ==="
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        python lichess-bot.py
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
