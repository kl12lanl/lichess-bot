name: Lichess Bot Execution

on:
  workflow_dispatch: # Включит заветную кнопку "плей" вручную!
  push:
    branches: [ master, main ]
  schedule:
    - cron: '*/30 * * * *' # Будет сам пинать бота каждые 30 минут

jobs:
  run-bot:
    runs-on: ubuntu-latest # Меняем зависающий Windows на быстрый Linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Bot Engine
      run: python lichess-bot.py
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
